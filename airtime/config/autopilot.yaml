# Autopilot defaults. The dashboard edits a copy stored by control; this file is the starting point.
mode: assist                 # off | assist (researches and suggests) | auto (the full loop, within the limits)
auto_upload: false           # false: an approved cut waits for the owner's one click
upload_visibility: public    # public | unlisted | private
upload_max_attempts: 3       # then needs_attention (upload_failed) and the owner uploads by hand

timezone: Asia/Kolkata       # the zone the crons below are read in
schedules:
  research_cron:   "0 */6 * * *"
  production_cron: "30 1 * * *"
  analytics_cron:  "15 */6 * * *"
  learning_cron:   "0 3 * * *"

limits:
  max_productions_per_day: 2
  max_concurrent: 1

timing:
  schedule_strategy: market_prime_time   # market_prime_time | immediate
  half_life_days: 21         # a learning's weight = confidence × 0.5^(age / half_life)
  max_age_days: 60           # a learning not confirmed for this long retires
  signal_max_age_days: 14    # older trend signals are ignored
  topic_cooldown_days: 45    # no near-duplicate topic within this window

analytics_checkpoints_h: [24, 72, 168, 336, 672]   # 24 h, 72 h, 7 d, 14 d, 28 d after publishing

markets_refit:
  min_videos: 8              # videos with by-country data before market weights move
  max_weight_change: 0.5     # a market weight stays within ±50 % of its default
  window_days: 60
