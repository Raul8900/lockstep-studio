[project]
name = "airtime-control"
version = "0.1.0"
description = "Airtime's orchestrator: state machines, scheduler, scoring, learning and the dashboard API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[project.scripts]
airtime-control = "control.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:control.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
