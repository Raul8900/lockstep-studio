<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lockstep renderer</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/components.js"></script>
<script src="js/kit.js"></script>
<script>
  /* The video's own code (components.js, scenes/*.js) is listed by the render
     server in project/manifest.json and loaded in order before booting. */
  (async function () {
    try {
      const manifest = await fetch('project/manifest.json').then((r) => r.json());
      for (const src of manifest.scripts) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src; s.async = false;
          s.onload = resolve;
          s.onerror = () => reject(new Error('could not load ' + src));
          document.body.appendChild(s);
        });
      }
      window.defineScenes = function () { for (const f of (window.SCENE_DEFS || [])) f(); };
      await boot();
    } catch (e) {
      window.BOOT_ERROR = String((e && e.stack) || e);
      console.error(e);
    }
  })();
  window.addEventListener('error', (ev) => { if (!window.READY) window.BOOT_ERROR = window.BOOT_ERROR || (ev.message + ' @ ' + ev.filename + ':' + ev.lineno); });
</script>
</body>
</html>
